apiVersion: apps/v1
kind: Deployment
metadata:
  name: vue-front-deployment
  namespace: default
  labels:
    app: vue-front
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vue-front
  template:
    metadata:
      labels:
        app: vue-front
    spec:
      containers:
        - name: vue-front
          image: ghcr.io/guney/vue-front:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10


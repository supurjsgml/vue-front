kind: containerapp
location: koreasouth
name: vue-front
resourceGroup: guney-aks
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: ${MANAGED_ENV_ID}
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 3000
      transport: auto
      allowInsecure: false
    registries:
      - server: ghcr.io
        username: ${GH_ACTOR}
        passwordSecretRef: ghcr-password
    secrets:
      - name: ghcr-password
        value: ${GH_TOKEN}
  template:
    containers:
      - name: vue-front
        image: ${IMAGE_TAG}
        resources:
          cpu: 0.25
          memory: 0.5Gi
        probes:
          - type: Liveness
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          - type: Readiness
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
        env:
          - name: NODE_ENV
            value: "production"
          - name: PORT
            value: "3000"
          - name: LOKI_URL
            value: "https://logs-prod-030.grafana.net/loki/api/v1/push"
          - name: LOKI_USER
            value: "${LOKI_USER}"
          - name: LOKI_TOKEN
            value: "${LOKI_TOKEN}"
          - name: AXIOM_API_URL
            value: "https://api.axiom.co/v1/datasets/"
          - name: AXIOM_DATASET
            value: "vue-front"
          - name: AXIOM_TOKEN
            value: "${AXIOM_TOKEN}"
    scale:
      minReplicas: 1
      maxReplicas: 2
      rules:
        - name: http-scaling-rule
          http:
            metadata:
              concurrentRequests: "100"

